name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Ubuntu / Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset debug

      - name: Build unit-test targets
        run: >
          cmake --build --preset debug --parallel --target
          encode_decode model_io pretokenizer training dataset_test

      - name: Run unit tests
        run: >
          ctest --test-dir build/debug --output-on-failure
          -R '^(tokenizer\.|dataset\.unit$|python\.unit$)'
