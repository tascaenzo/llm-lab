name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.build_type }} -DLLM_LAB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.build_type }}

  quality:
    name: Formatting and Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C formatting
        run: make check-format

      - name: Check Python syntax
        run: python3 -m compileall -q utils tests
